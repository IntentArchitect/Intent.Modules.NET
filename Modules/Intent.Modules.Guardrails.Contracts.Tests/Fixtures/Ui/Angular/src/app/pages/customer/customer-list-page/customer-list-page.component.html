<div class="page-header">
  <h1>Customers</h1>
  <button mat-raised-button color="primary" (click)="navigateToCustomerAddPage()">Add Customer</button>
</div>
<app-customer-summary-card [count]="customersModels?.totalCount"></app-customer-summary-card>
<table mat-table [dataSource]="customersModels?.data ?? []">
  <tr mat-row *matRowDef="let row; columns: ['name']" (click)="navigateToCustomerEditPage(row.id)"></tr>
</table>
